[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "educreditlab"
version = "1.28.1"
description = "Auditable cross-institutional course articulation and allocation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "cryptography>=41,<51"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.scripts]
educreditlab = "educreditlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
educreditlab = ["data/*.json", "web/*"]


